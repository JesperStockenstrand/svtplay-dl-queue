name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # Python 3.9 isn't available for the newest Ubuntu runner.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and end-to-end tests
        run: python -m unittest discover tests -v

      - name: Check extension manifest
        run: python -m json.tool extension/manifest.json

      - name: Install the helper (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh && bash -n uninstall.sh
          ./install.sh --all-browsers

      - name: Install the helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1

      - name: Use the installed helper like a browser
        run: python tests/check_install.py

      - name: Uninstall (macOS, Linux)
        if: runner.os != 'Windows'
        run: ./uninstall.sh

      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1
